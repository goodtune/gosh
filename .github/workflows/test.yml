name: Test

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  unit-tests:
    # macOS is in the matrix because the agent-socket trust check is
    # per-platform syscall code (LOCAL_PEERCRED) that cross-compiling only
    # proves compiles. It fails closed, so a darwin-only regression would
    # silently drop dotvault support rather than break a build.
    name: Go unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -race ./...

      - name: Build binary
        run: CGO_ENABLED=0 go build -o gosh ./cmd/gosh

      - name: Verify binary runs
        run: ./gosh version

      - name: Cross-compile all release targets
        if: matrix.os == 'ubuntu-latest'
        run: make build-all

  integration-tests:
    name: Integration tests (sshd + mosh-server container)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run integration tests
        run: make integration-test
